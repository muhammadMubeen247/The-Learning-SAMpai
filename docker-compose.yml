services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: learning-sampai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: Learning_SAMpai_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # ChromaDB vector store (runs as HTTP server so backend can use HttpClient instead
  # of PersistentClient; PersistentClient pulls in hnswlib.pyd which is blocked on
  # machines with Smart App Control enabled).
  chroma:
    image: chromadb/chroma:0.4.24
    container_name: learning-sampai-chroma
    ports:
      - "8001:8000"
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

  # Neo4j Knowledge Graph
  neo4j:
    image: neo4j:5.18-community
    container_name: learning-sampai-neo4j
    environment:
      NEO4J_AUTH: neo4j/sampai_neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning-sampai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./backend/chroma_data:/app/chroma_data
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learning-sampai-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  chroma_data:

networks:
  app-network:
    driver: bridge
